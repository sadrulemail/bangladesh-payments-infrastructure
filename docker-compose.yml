name: takarail

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takarail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "pnpm setup" to create .env}
      POSTGRES_DB: takarail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5544}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
